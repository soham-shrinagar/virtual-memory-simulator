name: Linux checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run Python tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest
      - name: Run JavaScript tests and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run --maxWorkers=2 --testTimeout=15000
          npm run build
      - name: Verify fresh wheel and source installs
        run: |
          python tools/stage_frontend.py
          python -m build --no-isolation
          python tools/verify_release.py --wheel dist/*.whl --source dist/*.tar.gz
      - name: Run browser tests against the installed wheel
        run: |
          python -m venv .venv-release
          source .venv-release/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install --no-deps dist/*.whl
          cd frontend
          npx --no-install playwright install --with-deps chromium firefox
          npm run test:browser
