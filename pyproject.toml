[build-system]
requires = ["setuptools>=77,<100"]
build-backend = "setuptools.build_meta"

[project]
name = "vmsim-os"
version = "0.1.0"
description = "An educational virtual memory simulator — Python engine and React interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[project.scripts]
vmsim = "vmsim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vmsim = ["web/static/*", "web/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

